<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - AI Expense Analyzer</title>

    <link rel="stylesheet" href="auth.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>💰 AI Expense Analyzer</h1>

            <h2>Create Account</h2>

            <p class="subtitle">
                Start tracking your expenses
            </p>


            <form id="registerForm">

                <input
                    type="text"
                    id="name"
                    placeholder="Full Name"
                    required
                >

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Create Account
                </button>

            </form>


            <p id="message"></p>


            <p class="switch">
                Already have an account?

                <a href="login.html">
                    Login
                </a>
            </p>

        </div>

    </div>


    <script src="auth.js"></script>

</body>

</html>
